# Locale metadata: one entry per origin. All locale-specific rules live here
# as data so the generator stays locale-agnostic. Name datasets are normalized
# CSVs generated from the names-dataset package (see scripts/generate_name_data.py)
# the source column documents provenance.
version: 3

origins:
  FRA:
    region: Europe
    label: French
    language: fr
    nationality: French
    name_order: given-first
    iso2: FR
    dial_code: "+33"
    phone_format: "{d} {p} {g1} {g2} {g3} {g4}"
    subscriber_digits: 8
    mobile_prefixes: ["6", "7"]
    email_domains: [gmail.com, outlook.com, orange.fr, free.fr, live.fr, yahoo.fr]
    cities: [Paris, Lyon, Marseille, Toulouse, Bordeaux, Lille, Nantes, Strasbourg, Nice, Montpellier, Rennes, Saint-Étienne, Toulon, Grenoble, Dijon, Angers]
    roles: [Manager, Engineer, Accountant, Teacher, Technician, Civil servant, Nurse, Sales representative]
